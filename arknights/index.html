<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arknights: Endfield – 3D Action Strategy RPG</title>
<meta name="description" content="Arknights: Endfield is a free-to-play 3D action strategy RPG. Lead a squad of Operators, explore an unknown planet and build your base. Free download for Windows PC.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,700;125,800&family=Outfit:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/hero-cine-poster.webp">
<style>
  :root{ --bg:#191919; --text:#ffffff; --muted:#999999; --accent:#fffa00; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif;overflow:hidden}
  .mono{font-family:Outfit,sans-serif;letter-spacing:.12em;text-transform:uppercase}

  .hero{cursor:pointer}
  .hero{position:relative;height:100vh;height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
  /* full-screen gameplay video behind everything */
  .hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  /* mobile: dark bottom for the text block */
  .hero::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(180deg,rgba(11,13,16,.6) 0%,rgba(11,13,16,.1) 18%,rgba(11,13,16,.2) 38%,rgba(11,13,16,.88) 62%,var(--bg) 100%)}
  /* desktop: dark left side for the text, action visible on the right */
  @media (min-width:900px){
    .hero::after{background:linear-gradient(90deg,rgba(11,13,16,.92) 0%,rgba(11,13,16,.75) 32%,rgba(11,13,16,.15) 62%,rgba(11,13,16,0) 100%),
                            linear-gradient(180deg,rgba(11,13,16,.5) 0%,transparent 16%,transparent 84%,rgba(11,13,16,.6) 100%)}
    .hero .content{margin:auto 0;padding-bottom:0;max-width:min(700px,46vw)}
    .hero h1{font-size:clamp(36px,min(4.2vw,8vh),68px)}
    .hero .legal{max-width:min(700px,46vw)}
  }

  .top{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,4vw,48px)}
  .brand{display:block;line-height:0}
  .brand img{height:clamp(30px,5.5vh,48px);width:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6))}
  .status{font-size:12px;color:var(--accent);font-weight:600}

  .content{margin-top:auto;padding:0 clamp(16px,4vw,48px) clamp(16px,3vh,32px);max-width:820px}
  .label{display:inline-flex;font-size:13px;color:var(--accent);border-left:3px solid var(--accent);padding-left:10px;margin-bottom:clamp(8px,1.6vh,16px)}
  h1{font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(38px,min(8vw,9vh),82px);line-height:.95;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{color:#c9d0d8;font-size:clamp(15px,2.2vw,19px);margin:clamp(10px,2vh,18px) 0 clamp(16px,3vh,28px);max-width:560px}

  .cta{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;
    color:#0b0d10;background:var(--accent);padding:15px 32px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
    transition:filter .15s,transform .15s;animation:glow 2.4s ease-in-out infinite}
  .cta:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .cta svg{width:20px;height:20px}
  @keyframes glow{50%{filter:brightness(1.18)}}
  .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:#c9d0d8}
  .meta span::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:8px;vertical-align:middle}

  .legal{padding:0 clamp(16px,4vw,48px) 12px;font-size:10.5px;line-height:1.45;color:var(--muted);max-width:820px}

  @media (max-width:600px){
    .cta{width:100%;justify-content:center}
    .status{display:none}
  }
  @media (max-height:600px){ .lead{display:none} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2184762152394803');

<!-- End Meta Pixel Code -->
</head>
<body>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=2184762152394803&ev=PageView&noscript=1"></noscript>

<main class="hero">
  <img class="poster" src="assets/hero-cine-poster.webp" alt="" aria-hidden="true">
  <video id="heroVid" muted loop playsinline disablepictureinpicture preload="none" poster="assets/hero-cine-poster.webp" aria-hidden="true">
    <source src="assets/hero-cine.webm" type="video/webm">
    <source src="assets/hero-cine.mp4" type="video/mp4">
  </video>

  <div class="top">
    <div class="brand"><img src="assets/logo/logo-white.svg" alt="Arknights: Endfield" width="290" height="48"></div>
    <div class="status">Free to play</div>
  </div>

  <div class="content">
    <div class="label mono">FREE 3D ACTION RPG + FACTORY BUILDING</div>
    <h1>Explore. Fight.<br><em>Automate Your Base.</em></h1>
    <p class="lead">A free anime RPG that mixes real-time squad combat and open-world exploration with automated factory building. Download it free for Windows PC.</p>
    <a class="cta js-cta" href="https://to.dordir.com/5A8G/2J3C3/" rel="nofollow sponsored noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
      Play Free Now
    </a>
    <div class="meta"><span>Windows PC</span><span>Free to play</span><span>Very Positive on Steam</span></div>
  </div>

</main>

<script>
(function(){
  // --- Offer link + forwarding of incoming query params (gclid, utm_*, sub ids…) ---
  var OFFER = "https://to.dordir.com/5A8G/2J3C3/";
  var FORWARD_PARAMS = true;
  var url = OFFER;
  try{
    if(FORWARD_PARAMS && location.search.length > 1){
      var u = new URL(OFFER), p = new URLSearchParams(location.search);
      p.forEach(function(v,k){ if(!u.searchParams.has(k)) u.searchParams.set(k,v); });
      url = u.toString();
    }
  }catch(e){}
  // --- Click: dataLayer + Meta Pixel custom event "go2offer", then go to the offer ---
  // Short delay so the Meta Pixel request leaves before the page unloads.
  var leaving = false;
  function goOffer(pos){
    if(leaving) return; leaving = true;
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({event:"go2offer", offer:"arknights-endfield", variant:"combat", cta_position:pos});
    if(window.fbq) fbq("trackCustom", "go2offer", {offer:"arknights-endfield", cta_position:pos});
    setTimeout(function(){ window.location.href = url; }, 250);
  }
  document.querySelectorAll(".js-cta").forEach(function(a){
    a.href = url;
    a.addEventListener("click",function(e){ e.preventDefault(); e.stopPropagation(); goOffer("hero"); });
  });

  // --- Whole page clickable ---
  document.querySelector(".hero").addEventListener("click",function(e){
    if(e.target.closest(".js-cta")) return;
    goOffer("page");
  });

  // --- Hero video: load after first paint, skip on reduced motion / data saver ---
  var hv = document.getElementById("heroVid");
  var saveData = navigator.connection && navigator.connection.saveData;
  var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!saveData && !still){
    window.addEventListener("load", function(){
      hv.muted = true; hv.preload = "auto"; hv.load();
      var pr = hv.play(); if(pr && pr.catch) pr.catch(function(){});
    });
  }
})();
</script>
</body>
</html>
